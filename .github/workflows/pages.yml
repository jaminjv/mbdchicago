name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/restaurant-website-ydodav]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on by hand once, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # A workflow token is not allowed to create the Pages site itself, so
      # without this check every push would fail the run and mail the owner.
      # Skip instead, and start deploying on its own once the toggle is on.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages is not enabled yet"
              echo
              echo "Nothing was deployed. To turn it on, open"
              echo "**Settings → Pages → Build and deployment** and set"
              echo "**Source** to **GitHub Actions**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Browsers cache assets/js/main.js and assets/data/content.js by URL,
      # and GitHub Pages does not let us send our own cache headers, so a
      # change to the menu or a section switch could otherwise sit here
      # while visitors kept running the copy they already had. Stamping the
      # links with a hash of each file changes the URL whenever the file
      # changes. Done at deploy time so the committed HTML stays clean.
      - if: steps.check.outputs.enabled == 'true'
        run: node tools/stamp-assets.mjs

      - if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
