name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/restaurant-website-ydodav]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Requires Pages to be switched on once, by hand:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow token is not allowed to create the Pages site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
