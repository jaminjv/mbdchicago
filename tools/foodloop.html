<!DOCTYPE html><meta charset="utf-8">
<style>html,body{margin:0;background:#241a16;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1440" height="810"></canvas>
<script>
const C = document.getElementById('c'), X = C.getContext('2d');
const W = C.width, H = C.height, T = 10;           // loop length, seconds
const SUN = '#fdb100', CREAM = '#fff3d6', WHITE = '#ffffff', COCOA = '#30221d', DEEP = '#1c1310';
const TAU = Math.PI * 2;

/* ---- stylized food, drawn around its own centre ---- */
function pancakes(g, s) {
  for (let i = 2; i >= 0; i--) {
    const y = i * 15 * s - 12 * s, w = (72 - i * 4) * s;
    g.fillStyle = i === 0 ? CREAM : '#e8c88e';
    g.beginPath(); g.ellipse(0, y, w, 15 * s, 0, 0, TAU); g.fill();
  }
  g.fillStyle = SUN;                                  // syrup pooling on top
  g.beginPath(); g.ellipse(0, -12 * s, 50 * s, 10 * s, 0, 0, TAU); g.fill();
  g.beginPath();
  g.moveTo(-30 * s, -10 * s); g.quadraticCurveTo(-36 * s, 6 * s, -26 * s, 14 * s);
  g.quadraticCurveTo(-20 * s, 4 * s, -22 * s, -8 * s); g.fill();
  g.fillStyle = '#f6d98f';                            // butter
  g.beginPath(); g.roundRect(-11 * s, -22 * s, 22 * s, 11 * s, 3 * s); g.fill();
}
function egg(g, s) {
  g.fillStyle = WHITE;
  g.beginPath();
  g.ellipse(0, 0, 56 * s, 40 * s, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(-30 * s, 14 * s, 24 * s, 18 * s, .4, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(28 * s, -12 * s, 20 * s, 15 * s, -.3, 0, TAU); g.fill();
  g.fillStyle = SUN;
  g.beginPath(); g.arc(4 * s, -2 * s, 19 * s, 0, TAU); g.fill();
}
function coffee(g, s) {
  g.fillStyle = CREAM;                                 // cup
  g.beginPath();
  g.moveTo(-34 * s, -20 * s); g.lineTo(30 * s, -20 * s);
  g.quadraticCurveTo(26 * s, 34 * s, -2 * s, 34 * s);
  g.quadraticCurveTo(-30 * s, 34 * s, -34 * s, -20 * s); g.fill();
  g.strokeStyle = CREAM; g.lineWidth = 7 * s;          // handle
  g.beginPath(); g.arc(34 * s, -2 * s, 15 * s, -1.1, 1.1); g.stroke();
  g.fillStyle = SUN;                                   // crema
  g.beginPath(); g.ellipse(-2 * s, -20 * s, 32 * s, 8 * s, 0, 0, TAU); g.fill();
  g.fillStyle = '#4a3428';
  g.beginPath(); g.ellipse(-2 * s, -20 * s, 24 * s, 5.5 * s, 0, 0, TAU); g.fill();
}
function waffle(g, s) {
  g.fillStyle = '#f0c96f';
  g.beginPath(); g.roundRect(-42 * s, -42 * s, 84 * s, 84 * s, 12 * s); g.fill();
  g.fillStyle = '#c9944a';
  for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) {
    g.beginPath(); g.roundRect((-30 + a * 24) * s, (-30 + b * 24) * s, 15 * s, 15 * s, 3 * s); g.fill();
  }
  g.fillStyle = SUN;
  g.beginPath(); g.arc(16 * s, -16 * s, 9 * s, 0, TAU); g.fill();
}
function croissant(g, s) {
  g.fillStyle = SUN;
  g.beginPath();
  g.moveTo(-48 * s, 16 * s);
  g.quadraticCurveTo(-30 * s, -34 * s, 0 * s, -30 * s);
  g.quadraticCurveTo(30 * s, -34 * s, 48 * s, 16 * s);
  g.quadraticCurveTo(24 * s, 2 * s, 0 * s, 6 * s);
  g.quadraticCurveTo(-24 * s, 2 * s, -48 * s, 16 * s); g.fill();
  g.fillStyle = 'rgba(48,34,29,.22)';
  for (let i = -1; i <= 1; i++) {
    g.beginPath(); g.ellipse(i * 17 * s, -12 * s, 5 * s, 13 * s, i * .25, 0, TAU); g.fill();
  }
}
function berry(g, s) {
  g.fillStyle = '#d8443f';
  g.beginPath();
  g.moveTo(0, 32 * s);
  g.quadraticCurveTo(-26 * s, 10 * s, -20 * s, -12 * s);
  g.quadraticCurveTo(-10 * s, -24 * s, 0, -18 * s);
  g.quadraticCurveTo(10 * s, -24 * s, 20 * s, -12 * s);
  g.quadraticCurveTo(26 * s, 10 * s, 0, 32 * s); g.fill();
  g.fillStyle = '#6f9a3f';
  g.beginPath(); g.ellipse(0, -20 * s, 17 * s, 6 * s, 0, 0, TAU); g.fill();
}
function orange(g, s) {
  g.fillStyle = SUN;
  g.beginPath(); g.arc(0, 0, 40 * s, 0, TAU); g.fill();
  g.fillStyle = '#ffd782';
  g.beginPath(); g.arc(0, 0, 33 * s, 0, TAU); g.fill();
  g.strokeStyle = SUN; g.lineWidth = 3 * s;
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * 33 * s, Math.sin(a) * 33 * s); g.stroke();
  }
}
const SHAPES = [pancakes, egg, coffee, waffle, croissant, berry, orange];

/* ---- three parallax layers of drifting food ---- */
const items = [];
let seed = 7;
const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
for (let layer = 0; layer < 3; layer++) {
  const count = [14, 11, 7][layer];
  for (let i = 0; i < count; i++) {
    items.push({
      draw: SHAPES[Math.floor(rnd() * SHAPES.length)],
      x: (i + 0.5) / count + (rnd() - 0.5) * 0.6, y0: (i / count + rnd() * 0.35) % 1,
      scale: [0.8, 1.3, 2.0][layer] * (0.8 + rnd() * 0.45),
      alpha: [0.38, 0.66, 0.95][layer],
      speed: [0.55, 0.85, 1.25][layer],
      rot: rnd() * TAU, amp: 0.18 + rnd() * 0.35, phase: rnd() * TAU,
      sway: (18 + rnd() * 34) * (rnd() > .5 ? 1 : -1)
    });
  }
}
items.sort((a, b) => a.scale - b.scale);

function steam(t) {                                   // warm wisps rising through it all
  X.save(); X.globalCompositeOperation = 'screen';
  for (let i = 0; i < 5; i++) {
    const p = (t / T + i / 5) % 1;
    const x = W * (0.12 + i * 0.19) + Math.sin(p * TAU + i) * 46;
    const y = H * (1.12 - p * 1.3);
    const r = 150 + i * 40;
    const fade = Math.sin(p * Math.PI);
    const g = X.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(253,177,0,${0.16 * fade})`);
    g.addColorStop(1, 'rgba(253,177,0,0)');
    X.fillStyle = g; X.beginPath(); X.arc(x, y, r, 0, TAU); X.fill();
  }
  X.restore();
}

function frame(t) {                                   // t in [0, T)
  const p = t / T;
  const bg = X.createLinearGradient(0, 0, W, H);
  const shift = Math.sin(p * TAU) * 0.06;
  bg.addColorStop(0, '#2b1e18');
  bg.addColorStop(Math.max(0.05, 0.45 + shift), '#5c3f2c');
  bg.addColorStop(1, '#33241d');
  X.fillStyle = bg; X.fillRect(0, 0, W, H);

  const warm = X.createRadialGradient(W * 0.62, H * 0.34, 0, W * 0.62, H * 0.34, H * 1.05);
  warm.addColorStop(0, `rgba(253,177,0,${0.3 + shift})`);
  warm.addColorStop(1, 'rgba(253,177,0,0)');
  X.fillStyle = warm; X.fillRect(0, 0, W, H);

  const M = 240;                                       // off-screen margin
  for (const it of items) {
    const span = H + M * 2;
    const y = ((it.y0 + p * it.speed) % 1) * span - M;
    const x = it.x * W + Math.sin(p * TAU + it.phase) * it.sway;
    X.save();
    X.globalAlpha = it.alpha;
    X.translate(x, H + M - y);
    X.rotate(it.rot + Math.sin(p * TAU + it.phase) * it.amp);
    X.shadowColor = 'rgba(20,12,9,.55)'; X.shadowBlur = 26 * it.scale; X.shadowOffsetY = 10 * it.scale;
    it.draw(X, it.scale);
    X.restore();
  }
  steam(t);

  const vig = X.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.92);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(20,12,9,.42)');
  X.fillStyle = vig; X.fillRect(0, 0, W, H);
}

window.renderFrame = (n, fps) => frame((n / fps) % T);
window.LOOP = { T };
frame(0);
</script>
